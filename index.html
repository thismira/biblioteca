<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M’s Library</title>
  <meta name="description" content="Uma biblioteca virtual: estantes, livros lidos, trechos favoritos e lista de desejos.">
  <meta name="theme-color" content="#F5DADF">
  <!-- Pede aos buscadores (Google etc.) para não listar o site: só quem tem o link chega até ele -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <meta name="apple-mobile-web-app-title" content="M’s Library">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="stylesheet" href="css/add-book.css">
  <link rel="stylesheet" href="css/detail.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="stylesheet" href="css/wishlist.css">
  <link rel="stylesheet" href="css/backup.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header class="topo">
    <h1>M’s Library</h1>
    <svg class="ornamento" viewBox="0 0 240 24" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
        <path d="M14 12 H98" />
        <path d="M142 12 H226" />
        <path d="M98 12 q7 -8 14 0 q-7 8 -14 0" />
        <path d="M142 12 q-7 -8 -14 0 q7 8 14 0" />
      </g>
      <g fill="currentColor">
        <circle cx="120" cy="12" r="2.6" />
        <circle cx="120" cy="5" r="1.1" />
        <circle cx="120" cy="19" r="1.1" />
        <circle cx="8" cy="12" r="1.6" />
        <circle cx="232" cy="12" r="1.6" />
      </g>
    </svg>
  </header>

  <main id="app">
    <section class="area-estante" aria-label="Biblioteca">
      <div class="barra">
        <button class="botao" type="button" id="btn-adicionar">+ Adicionar livro</button>
        <button class="botao secundario" type="button" id="btn-backup">Conta e backup</button>
      </div>
      <p class="vazio" id="estante-vazia">Sua estante está esperando o primeiro livro…</p>

      <!-- A "sala": busca + estantes em miniatura -->
      <div class="sala-area" id="sala-area">
        <div class="busca-sala" role="search">
          <input type="search" id="busca-livros" placeholder="Procurar um livro da sua biblioteca…" autocomplete="off" aria-label="Procurar um livro da sua biblioteca">
          <ul class="busca-resultados" id="busca-resultados" hidden></ul>
        </div>
        <div class="sala" id="sala" aria-label="Suas estantes"></div>
      </div>

      <!-- Uma estante aberta -->
      <div class="vista-estante" id="vista-estante" hidden>
        <div class="vista-cabecalho">
          <button class="botao secundario" type="button" id="btn-sala">← Sala</button>
          <div class="vista-titulo">
            <h2 id="vista-nome"></h2>
            <span id="vista-contagem"></span>
          </div>
          <button class="botao" type="button" id="btn-novo-desejo" hidden>+ Adicionar desejo</button>
          <div class="vista-acoes" id="vista-acoes" hidden>
            <button class="botao secundario" type="button" data-acao="adicionar-livros">+ Adicionar livros</button>
            <button class="link" type="button" data-acao="renomear">Renomear</button>
            <button class="link" type="button" data-acao="apagar-estante">Apagar estante</button>
          </div>
        </div>
        <div class="lista-desejos" id="lista-desejos" hidden></div>
        <div class="vista-filtros" id="vista-filtros">
          <div class="busca-estante" role="search">
            <input type="search" id="busca-estante" placeholder="Buscar nesta estante…" autocomplete="off" aria-label="Buscar nesta estante">
          </div>
          <label class="ordenar" id="vista-ordenar">
            Ordenar por
            <select id="vista-ordem"></select>
          </label>
          <div class="filtro-nota" id="filtro-nota" role="group" aria-label="Mostrar só livros com estas notas">
            <span class="filtro-rotulo">Nota:</span>
            <button type="button" data-nota="5" aria-pressed="false">5★</button>
            <button type="button" data-nota="4" aria-pressed="false">4★</button>
            <button type="button" data-nota="3" aria-pressed="false">3★</button>
            <button type="button" data-nota="2" aria-pressed="false">2★</button>
            <button type="button" data-nota="1" aria-pressed="false">1★</button>
            <button type="button" data-nota="0" aria-pressed="false">sem nota</button>
            <button type="button" class="link" data-acao="limpar-filtro" hidden>limpar</button>
          </div>
        </div>
        <p class="vazio" id="vista-vazia" hidden></p>
        <div class="movel" id="movel-vista">
          <div class="movel-topo"><span class="placa" id="vista-placa"></span></div>
          <div id="estante-lendo" aria-label="Lendo agora" hidden></div>
          <div id="estante"></div>
          <div class="movel-base" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- supabase-js 2.118.0 (cópia local, conferida no jsDelivr e no unpkg) -->
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
